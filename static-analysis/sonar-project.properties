sonar.projectKey=nedelko
sonar.projectName=Nedelko
sonar.sourceEncoding=UTF-8
sonar.sources=backend,frontend/src,frontend/styles,frontend/index.html,scripts,static-analysis,api-tests/scripts,Dockerfile,compose.yaml
sonar.tests=backend/tests,frontend/tests,scripts/tests,static-analysis/tests
sonar.exclusions=backend/tests/**,scripts/tests/**,static-analysis/tests/**,**/AGENTS.md
# The application coverage contract includes every authored backend/frontend JS file.
# Tooling has its own regression tests; CSS has no executable line coverage.
sonar.coverage.exclusions=scripts/**,static-analysis/**,api-tests/scripts/**,frontend/styles/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
# Scanner receives only selected source mounts, not the host Git directory.
sonar.scm.disabled=true
