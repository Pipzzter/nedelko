name: nedelko

services:
  sonar-db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      # Local-only development DB, with no published port. Set before first boot.
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in static-analysis/.env}
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [analysis]

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in static-analysis/.env}
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    networks: [analysis]

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:12
    profiles: [analysis]
    working_dir: /usr/src
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      # The scanner sees source and coverage, never .env, SQLite or cached observations.
      - ../backend:/usr/src/backend:ro
      - ../frontend/src:/usr/src/frontend/src:ro
      - ../frontend/styles:/usr/src/frontend/styles:ro
      - ../frontend/index.html:/usr/src/frontend/index.html:ro
      - ../frontend/tests:/usr/src/frontend/tests:ro
      - ../scripts:/usr/src/scripts:ro
      - ../api-tests/scripts:/usr/src/api-tests/scripts:ro
      - ../coverage:/usr/src/coverage:ro
      - ./sonar-project.properties:/usr/src/sonar-project.properties:ro
      - ../Dockerfile:/usr/src/Dockerfile:ro
      - ../compose.yaml:/usr/src/compose.yaml:ro
      - ./sonar.js:/usr/src/static-analysis/sonar.js:ro
      - ./configure.js:/usr/src/static-analysis/configure.js:ro
      - ./lib:/usr/src/static-analysis/lib:ro
      - ./tests:/usr/src/static-analysis/tests:ro
      - ./compose.yaml:/usr/src/static-analysis/compose.yaml:ro
      - scanner_cache:/opt/sonar-scanner/.sonar/cache
    command: ["-Dsonar.qualitygate.wait=true", "-Dsonar.qualitygate.timeout=300", "-Dsonar.working.directory=/tmp/analysis"]
    networks: [analysis]

networks:
  analysis:

volumes:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  scanner_cache:
